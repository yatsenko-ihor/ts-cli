name: release

# Builds binaries for Linux, macOS and Windows and attaches them to a GitHub
# Release. Two ways to start it:
#   - push a tag:   git tag -a v1.2.3 -m "ts-cli v1.2.3" && git push origin v1.2.3
#   - run it by hand (Actions -> release -> Run workflow) and give the tag;
#     the tag is created on the selected branch if it does not exist yet.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.2.3"
        required: true

permissions:
  contents: read

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: check the tag
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$TAG' is not a version tag like v1.2.3 or v1.2.3-rc1"; exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: install sshpass (exercises the password-prompt path in tests)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - run: go vet ./...
      - run: go test -race ./...

  build:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - {goos: linux,   goarch: amd64}
          - {goos: linux,   goarch: arm64}
          - {goos: darwin,  goarch: amd64}
          - {goos: darwin,  goarch: arm64}
          - {goos: windows, goarch: amd64}
          - {goos: windows, goarch: arm64}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build and package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          NAME="ts-cli_${VERSION}_${GOOS}_${GOARCH}"
          EXT=""; [ "$GOOS" = "windows" ] && EXT=".exe"
          mkdir -p "dist/$NAME"
          go build -trimpath \
            -ldflags "-s -w -X github.com/yatsenko-ihor/ts-cli/commands.Version=${VERSION}" \
            -o "dist/$NAME/ts-cli${EXT}" .
          cp README.md LICENSE SECURITY.md "dist/$NAME/"
          cd dist
          if [ "$GOOS" = "windows" ]; then
            zip -qr "$NAME.zip" "$NAME"
          else
            tar -czf "$NAME.tar.gz" "$NAME"
          fi
          rm -rf "$NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: dist
      - name: checksums
        run: cd dist && sha256sum * > checksums.txt && cat checksums.txt
      - name: create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          PRE=""; case "$TAG" in *-*) PRE="--prerelease";; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::release $TAG already exists"; exit 1
          fi
          gh release create "$TAG" dist/* \
            --title "ts-cli $TAG" --generate-notes --target "$GITHUB_SHA" $PRE
